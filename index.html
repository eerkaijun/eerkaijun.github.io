<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kai</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header class="terminal-header">
        <div class="terminal-prompt">
            <span class="prompt-user">visitor@kai</span><span class="prompt-separator">:</span><span class="prompt-path">~</span><span class="prompt-symbol">$</span>
            <input type="text" id="command-input" class="command-input" placeholder="type a command..." autocomplete="off" spellcheck="false">
        </div>
        <div class="terminal-hints">
            <span class="hint-label">try:</span>
            <button class="hint-cmd" data-cmd="home">home</button>
            <button class="hint-cmd" data-cmd="work">work</button>
            <button class="hint-cmd" data-cmd="startups">startups</button>
            <button class="hint-cmd" data-cmd="opensource">opensource</button>
            <button class="hint-cmd" data-cmd="hackathons">hackathons</button>
            <button class="hint-cmd" data-cmd="writings">writings</button>
        </div>
    </header>

    <main class="container">
        <div id="terminal-output" class="terminal-output"></div>
        <div id="content" class="content">
            <p class="loading">Loading...</p>
        </div>
    </main>

    <footer class="footer">
        <p><a href="https://twitter.com/kaijuneer" target="_blank">twitter</a> / <a href="https://github.com/eerkaijun" target="_blank">github</a></p>
    </footer>

    <script>
        const routes = {
            'home': 'README.md',
            'work': 'docs/work.md',
            'startups': 'docs/startups.md',
            'opensource': 'docs/open-source.md',
            'hackathons': 'docs/hackathons.md',
            'writings': 'docs/writings.md'
        };

        const cache = {};
        const commandInput = document.getElementById('command-input');
        const terminalOutput = document.getElementById('terminal-output');
        const contentDiv = document.getElementById('content');

        // Execute command
        async function executeCommand(cmd) {
            const command = cmd.toLowerCase().trim();

            // Show command in output
            terminalOutput.innerHTML = `<span class="output-cmd">> ${command}</span>`;

            if (command === 'help' || command === '?') {
                terminalOutput.innerHTML += `<span class="output-response">available: home, work, startups, opensource, hackathons, writings</span>`;
                return;
            }

            if (command === 'clear' || command === 'cls') {
                terminalOutput.innerHTML = '';
                contentDiv.innerHTML = '';
                contentDiv.classList.remove('loaded');
                return;
            }

            if (routes[command]) {
                terminalOutput.innerHTML += `<span class="output-response">loading ${command}...</span>`;
                await loadContent(command);
                history.pushState(null, '', `#${command}`);
            } else if (command !== '') {
                terminalOutput.innerHTML += `<span class="output-error">command not found: ${command}</span>`;
                terminalOutput.innerHTML += `<span class="output-hint">type 'help' for available commands</span>`;
            }
        }

        // Load markdown content
        async function loadContent(route) {
            const file = routes[route];
            if (!file) return;

            contentDiv.classList.remove('loaded');

            try {
                let markdown;
                if (cache[file]) {
                    markdown = cache[file];
                } else {
                    const response = await fetch(file);
                    if (!response.ok) throw new Error('Failed to load');
                    markdown = await response.text();
                    cache[file] = markdown;
                }

                const html = marked.parse(markdown);
                contentDiv.innerHTML = html;

                requestAnimationFrame(() => {
                    contentDiv.classList.add('loaded');
                });

                contentDiv.querySelectorAll('a').forEach(link => {
                    if (link.hostname !== window.location.hostname) {
                        link.setAttribute('target', '_blank');
                        link.setAttribute('rel', 'noopener noreferrer');
                    }
                });

                terminalOutput.innerHTML = `<span class="output-cmd">> ${route}</span><span class="output-success">loaded ${route}</span>`;

            } catch (error) {
                contentDiv.innerHTML = '<p>Failed to load content.</p>';
                terminalOutput.innerHTML += `<span class="output-error">error loading ${route}</span>`;
            }

            window.scrollTo(0, 0);
        }

        // Input handling
        commandInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                executeCommand(commandInput.value);
                commandInput.value = '';
            }
        });

        // Clickable hints
        document.querySelectorAll('.hint-cmd').forEach(btn => {
            btn.addEventListener('click', () => {
                const cmd = btn.dataset.cmd;
                commandInput.value = cmd;
                executeCommand(cmd);
                commandInput.value = '';
                commandInput.focus();
            });
        });

        // Focus input on page click
        document.addEventListener('click', (e) => {
            if (!window.getSelection().toString() &&
                !e.target.closest('a') &&
                !e.target.closest('button') &&
                !e.target.closest('input')) {
                commandInput.focus();
            }
        });

        // Handle browser back/forward
        window.addEventListener('hashchange', () => {
            const route = window.location.hash.replace('#', '') || 'home';
            if (routes[route]) {
                loadContent(route);
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            const route = window.location.hash.replace('#', '') || 'home';
            loadContent(routes[route] ? route : 'home');
            commandInput.focus();
        });
    </script>
</body>
</html>
